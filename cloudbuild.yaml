# Cloud Build configuration for Guild-AI
# This file defines the CI/CD pipeline for building and deploying to Cloud Run

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/guild-ai:latest'
      - '-f'
      - './api_server/Dockerfile'
      - '.'
    id: 'build-image'

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/guild-ai:latest'
    id: 'push-image'
    waitFor: ['build-image']

  # Step 3: Run Database Migrations (with Cloud SQL Proxy)
  - name: 'gcr.io/$PROJECT_ID/guild-ai:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        # Download and setup Cloud SQL Proxy
        wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O /tmp/cloud_sql_proxy
        chmod +x /tmp/cloud_sql_proxy
        
        # Start Cloud SQL Proxy in background
        /tmp/cloud_sql_proxy -instances=guild-ai-080:us-central1:guild-ai-sql=tcp:5432 &
        PROXY_PID=$$!
        
        # Wait for proxy to be ready
        sleep 5
        
        # Create database if it doesn't exist
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'workflow_db'" | grep -q 1 ||         PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE workflow_db"
        
        # Run migrations
        /usr/local/bin/python /app/api_server/src/manage.py migrate
        
        # Kill proxy
        kill $$PROXY_PID
    id: 'run-migrations'
    waitFor: ['push-image']
    env:
      - 'GOOGLE_CLOUD_PROJECT=guild-ai-080'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_DB=workflow_db'
      - 'POSTGRES_PASSWORD=${_DB_PASSWORD}'
      - 'POSTGRES_HOST=127.0.0.1'
      - 'POSTGRES_PORT=5432'
      - 'REDIS_HOST=10.87.64.4'
      - 'REDIS_PORT=6379'
      - 'LLM_PROVIDER=vertex_ai'
      - 'VERTEX_AI_LOCATION=us-central1'
      - 'VERTEX_AI_MODEL=gemini-pro'
      - 'FASTAPI_APP_ENV=production'
      - 'RQ_QUEUES={"default": {"HOST": "10.87.64.4", "PORT": 6379, "DB": 0}}'
      - 'DJANGO_SETTINGS_MODULE=api_server.src.django_settings'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'guild-ai-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/guild-ai:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '600'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '1'
      - '--cpu-boost'
      - '--set-env-vars'
      - |
        GOOGLE_CLOUD_PROJECT=$PROJECT_ID,
        CLOUDSQL_CONNECTION_NAME=guild-ai-080:us-central1:guild-ai-sql,
        POSTGRES_USER=postgres,
        POSTGRES_DB=workflow_db,
        DB_SECRET_NAME=db-root-password,
        REDIS_HOST=10.87.64.4,
        REDIS_PORT=6379,
        LLM_PROVIDER=vertex_ai,
        VERTEX_AI_LOCATION=us-central1,
        VERTEX_AI_MODEL=gemini-pro,
        FASTAPI_APP_ENV=production
      - '--add-cloudsql-instances'
      - 'guild-ai-080:us-central1:guild-ai-sql'
      - '--service-account'
      - 'guild-ai-cloud-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector'
      - 'guild-ai-vpc-connector'
      - '--vpc-egress'
      - 'all'
    id: 'deploy-cloud-run'
    waitFor: ['run-migrations']

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/guild-ai:latest'
