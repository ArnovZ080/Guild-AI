# Cloud Build configuration for Guild-AI
# This file defines the CI/CD pipeline for building and deploying to Cloud Run

steps:
  # Step 0: Fetch Firebase Config from Secret Manager
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Fetching Firebase configuration from Secret Manager..."
        
        # Fetch all Firebase secrets
        FIREBASE_API_KEY=$(gcloud secrets versions access latest --secret=firebase-api-key)
        FIREBASE_AUTH_DOMAIN=$(gcloud secrets versions access latest --secret=firebase-auth-domain)
        FIREBASE_PROJECT_ID=$(gcloud secrets versions access latest --secret=firebase-project-id)
        FIREBASE_STORAGE_BUCKET=$(gcloud secrets versions access latest --secret=firebase-storage-bucket)
        FIREBASE_MESSAGING_SENDER_ID=$(gcloud secrets versions access latest --secret=firebase-messaging-sender-id)
        FIREBASE_APP_ID=$(gcloud secrets versions access latest --secret=firebase-app-id)
        
        # Paystack public key (from env-vars.yaml or will be set via Cloud Run)
        PAYSTACK_PUBLIC_KEY="pk_live_922abd14db6d404fb684764611c349c601d9151d"
        
        # Create .env.production file for frontend build
        cat > frontend/.env.production <<ENVFILE
        VITE_API_URL=https://guildof1.com
        VITE_FIREBASE_API_KEY=$${FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN=$${FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID=$${FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET=$${FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID=$${FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID=$${FIREBASE_APP_ID}
        VITE_PAYSTACK_PUBLIC_KEY=$${PAYSTACK_PUBLIC_KEY}
        ENVFILE
        
        echo "✅ Firebase and Paystack configuration written to frontend/.env.production"
    id: 'fetch-firebase-config'

  # Step 1: Build Frontend
  - name: 'node:20'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Building frontend..."
        cd frontend
        
        # Install dependencies
        npm ci
        
        # Build for production (uses .env.production from previous step)
        npm run build
        
        echo "Frontend built successfully!"
        ls -la dist/
        
        # Verify dist exists and has files
        if [ ! -d "dist" ]; then
          echo "ERROR: dist directory not created!"
          exit 1
        fi
        
        if [ ! -f "dist/index.html" ]; then
          echo "ERROR: dist/index.html not found!"
          exit 1
        fi
        
        echo "✅ Frontend build verified: $(du -sh dist)"
    id: 'build-frontend'
    waitFor: ['fetch-firebase-config']
  
  # Step 2: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/guild-ai:latest'
      - '-f'
      - './api_server/Dockerfile'
      - '.'
    id: 'build-image'
    waitFor: ['build-frontend']

  # Step 3: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/guild-ai:latest'
    id: 'push-image'
    waitFor: ['build-image']

  # Step 4: Run Database Migrations (with Cloud SQL Proxy)
  - name: 'gcr.io/$PROJECT_ID/guild-ai:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        # Download and setup Cloud SQL Proxy
        wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O /tmp/cloud_sql_proxy
        chmod +x /tmp/cloud_sql_proxy
        
        # Start Cloud SQL Proxy in background
        /tmp/cloud_sql_proxy -instances=guild-ai-080:us-central1:guild-ai-sql=tcp:5432 &
        PROXY_PID=$$!
        
        # Wait for proxy to be ready
        sleep 5
        
        # Create database if it doesn't exist
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'workflow_db'" | grep -q 1 ||         PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE workflow_db"
        
        # Add firebase_uid column if it doesn't exist
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ADD COLUMN IF NOT EXISTS firebase_uid VARCHAR UNIQUE;"
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ALTER COLUMN supabase_id DROP NOT NULL;"
        
        # Add beta tester columns to users table
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ADD COLUMN IF NOT EXISTS is_beta_tester BOOLEAN DEFAULT FALSE;"
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ADD COLUMN IF NOT EXISTS beta_access_granted_at TIMESTAMP;"
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ADD COLUMN IF NOT EXISTS beta_access_granted_by VARCHAR;"
        
        # Add admin columns to users table
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ADD COLUMN IF NOT EXISTS is_admin BOOLEAN DEFAULT FALSE;"
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ADD COLUMN IF NOT EXISTS admin_role VARCHAR;"
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ADD COLUMN IF NOT EXISTS admin_granted_at TIMESTAMP;"
        
        # Create waiting_list table if it doesn't exist
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "
        CREATE TABLE IF NOT EXISTS waiting_list (
          id VARCHAR PRIMARY KEY,
          email VARCHAR UNIQUE NOT NULL,
          full_name VARCHAR,
          company VARCHAR,
          role VARCHAR,
          how_heard VARCHAR,
          use_case TEXT,
          status VARCHAR DEFAULT 'pending',
          invited_at TIMESTAMP,
          converted_at TIMESTAMP,
          converted_user_id VARCHAR REFERENCES users(id),
          referral_source VARCHAR,
          utm_campaign VARCHAR,
          utm_source VARCHAR,
          utm_medium VARCHAR,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          admin_notes TEXT
        );
        CREATE INDEX IF NOT EXISTS idx_waiting_list_email ON waiting_list(email);
        CREATE INDEX IF NOT EXISTS idx_waiting_list_status ON waiting_list(status);
        "
        
        # Create onboarding_data table if it doesn't exist
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "
        CREATE TABLE IF NOT EXISTS onboarding_data (
          id VARCHAR PRIMARY KEY,
          user_id VARCHAR UNIQUE REFERENCES users(id),
          business_type VARCHAR,
          business_description TEXT,
          industry VARCHAR,
          target_audience TEXT,
          customer_avatar JSONB,
          audience_problems TEXT,
          audience_size VARCHAR,
          brand_voice_tone VARCHAR,
          brand_personality JSONB,
          brand_colors JSONB,
          logo_status VARCHAR,
          brand_values JSONB,
          brand_story TEXT,
          brand_differentiation TEXT,
          brand_consistency VARCHAR,
          pricing_status VARCHAR,
          pricing_model VARCHAR,
          marketing_budget VARCHAR,
          revenue_goals VARCHAR,
          priority_3months TEXT,
          key_metrics JSONB,
          success_definition TEXT,
          communication_style VARCHAR,
          data_storage_preference VARCHAR,
          security_preference VARCHAR,
          incomplete_fields JSONB DEFAULT '[]',
          completion_percentage INTEGER DEFAULT 0,
          needs_follow_up BOOLEAN DEFAULT FALSE,
          raw_responses JSONB DEFAULT '{}',
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          completed_at TIMESTAMP
        );"
        
        # Run migrations
        /usr/local/bin/python /app/api_server/src/manage.py migrate
        
        # Kill proxy
        kill $$PROXY_PID
    id: 'run-migrations'
    waitFor: ['push-image']
    env:
      - 'GOOGLE_CLOUD_PROJECT=guild-ai-080'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_DB=workflow_db'
      - 'POSTGRES_PASSWORD=${_DB_PASSWORD}'
      - 'POSTGRES_HOST=127.0.0.1'
      - 'POSTGRES_PORT=5432'
      - 'REDIS_HOST=10.87.64.4'
      - 'REDIS_PORT=6379'
      - 'LLM_PROVIDER=vertex_ai'
      - 'VERTEX_AI_LOCATION=us-central1'
      - 'VERTEX_AI_MODEL=gemini-pro'
      - 'FASTAPI_APP_ENV=production'
      - 'RQ_QUEUES={"default": {"HOST": "10.87.64.4", "PORT": 6379, "DB": 0}}'
      - 'DJANGO_SETTINGS_MODULE=api_server.src.django_settings'

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'guild-ai-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/guild-ai:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '600'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '1'
      - '--cpu-boost'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=guild-ai-080,CLOUDSQL_CONNECTION_NAME=guild-ai-080:us-central1:guild-ai-sql,POSTGRES_USER=postgres,POSTGRES_DB=workflow_db,REDIS_HOST=10.87.64.4,REDIS_PORT=6379,LLM_PROVIDER=vertex_ai,VERTEX_AI_LOCATION=us-central1,VERTEX_AI_MODEL=gemini-pro,FASTAPI_APP_ENV=production,DB_SECRET_NAME=db-root-password'
      - '--update-secrets'
      - 'POSTGRES_PASSWORD=db-root-password:latest'
      - '--add-cloudsql-instances'
      - 'guild-ai-080:us-central1:guild-ai-sql'
      - '--service-account'
      - 'guild-ai-cloud-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector'
      - 'guild-ai-vpc-connector'
      - '--vpc-egress'
      - 'all'
    id: 'deploy-cloud-run'
    waitFor: ['run-migrations']

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/guild-ai:latest'

# Logging configuration (required when using custom service account)
options:
  logging: CLOUD_LOGGING_ONLY
  logStreamingOption: STREAM_ON
