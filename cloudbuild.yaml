# Cloud Build configuration for Guild-AI
# This file defines the CI/CD pipeline for building and deploying to Cloud Run

steps:
  # Step 0: Build Frontend
  - name: 'node:20'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Building frontend..."
        cd frontend
        
        # Install dependencies
        npm ci
        
        # Set production API URL (same domain as backend)
        echo "VITE_API_URL=https://guildof1.com" > .env.production
        echo "VITE_FIREBASE_API_KEY=${_FIREBASE_API_KEY}" >> .env.production
        echo "VITE_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}" >> .env.production
        echo "VITE_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}" >> .env.production
        echo "VITE_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}" >> .env.production
        echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}" >> .env.production
        echo "VITE_FIREBASE_APP_ID=${_FIREBASE_APP_ID}" >> .env.production
        
        # Build for production
        npm run build
        
        echo "Frontend built successfully!"
        ls -la dist/
        
        # Verify dist exists and has files
        if [ ! -d "dist" ]; then
          echo "ERROR: dist directory not created!"
          exit 1
        fi
        
        if [ ! -f "dist/index.html" ]; then
          echo "ERROR: dist/index.html not found!"
          exit 1
        fi
        
        echo "✅ Frontend build verified: $(du -sh dist)"
    id: 'build-frontend'
  
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/guild-ai:latest'
      - '-f'
      - './api_server/Dockerfile'
      - '.'
    id: 'build-image'
    waitFor: ['build-frontend']

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/guild-ai:latest'
    id: 'push-image'
    waitFor: ['build-image']

  # Step 3: Run Database Migrations (with Cloud SQL Proxy)
  - name: 'gcr.io/$PROJECT_ID/guild-ai:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        # Download and setup Cloud SQL Proxy
        wget https://dl.google.com/cloudsql/cloud_sql_proxy.linux.amd64 -O /tmp/cloud_sql_proxy
        chmod +x /tmp/cloud_sql_proxy
        
        # Start Cloud SQL Proxy in background
        /tmp/cloud_sql_proxy -instances=guild-ai-080:us-central1:guild-ai-sql=tcp:5432 &
        PROXY_PID=$$!
        
        # Wait for proxy to be ready
        sleep 5
        
        # Create database if it doesn't exist
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'workflow_db'" | grep -q 1 ||         PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE workflow_db"
        
        # Add firebase_uid column if it doesn't exist
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ADD COLUMN IF NOT EXISTS firebase_uid VARCHAR UNIQUE;"
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "ALTER TABLE users ALTER COLUMN supabase_id DROP NOT NULL;"
        
        # Create onboarding_data table if it doesn't exist
        PGPASSWORD=${_DB_PASSWORD} psql -h 127.0.0.1 -U postgres -d workflow_db -c "
        CREATE TABLE IF NOT EXISTS onboarding_data (
          id VARCHAR PRIMARY KEY,
          user_id VARCHAR UNIQUE REFERENCES users(id),
          business_type VARCHAR,
          business_description TEXT,
          industry VARCHAR,
          target_audience TEXT,
          customer_avatar JSONB,
          audience_problems TEXT,
          audience_size VARCHAR,
          brand_voice_tone VARCHAR,
          brand_personality JSONB,
          brand_colors JSONB,
          logo_status VARCHAR,
          brand_values JSONB,
          brand_story TEXT,
          brand_differentiation TEXT,
          brand_consistency VARCHAR,
          pricing_status VARCHAR,
          pricing_model VARCHAR,
          marketing_budget VARCHAR,
          revenue_goals VARCHAR,
          priority_3months TEXT,
          key_metrics JSONB,
          success_definition TEXT,
          communication_style VARCHAR,
          data_storage_preference VARCHAR,
          security_preference VARCHAR,
          incomplete_fields JSONB DEFAULT '[]',
          completion_percentage INTEGER DEFAULT 0,
          needs_follow_up BOOLEAN DEFAULT FALSE,
          raw_responses JSONB DEFAULT '{}',
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          completed_at TIMESTAMP
        );"
        
        # Run migrations
        /usr/local/bin/python /app/api_server/src/manage.py migrate
        
        # Kill proxy
        kill $$PROXY_PID
    id: 'run-migrations'
    waitFor: ['push-image']
    env:
      - 'GOOGLE_CLOUD_PROJECT=guild-ai-080'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_DB=workflow_db'
      - 'POSTGRES_PASSWORD=${_DB_PASSWORD}'
      - 'POSTGRES_HOST=127.0.0.1'
      - 'POSTGRES_PORT=5432'
      - 'REDIS_HOST=10.87.64.4'
      - 'REDIS_PORT=6379'
      - 'LLM_PROVIDER=vertex_ai'
      - 'VERTEX_AI_LOCATION=us-central1'
      - 'VERTEX_AI_MODEL=gemini-pro'
      - 'FASTAPI_APP_ENV=production'
      - 'RQ_QUEUES={"default": {"HOST": "10.87.64.4", "PORT": 6379, "DB": 0}}'
      - 'DJANGO_SETTINGS_MODULE=api_server.src.django_settings'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'guild-ai-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/guild-ai:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '5000'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '600'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '1'
      - '--cpu-boost'
      - '--set-env-vars'
      - |
        GOOGLE_CLOUD_PROJECT=$PROJECT_ID,
        CLOUDSQL_CONNECTION_NAME=guild-ai-080:us-central1:guild-ai-sql,
        POSTGRES_USER=postgres,
        POSTGRES_DB=workflow_db,
        POSTGRES_PASSWORD=${_DB_PASSWORD},
        DB_SECRET_NAME=db-root-password,
        REDIS_HOST=10.87.64.4,
        REDIS_PORT=6379,
        LLM_PROVIDER=vertex_ai,
        VERTEX_AI_LOCATION=us-central1,
        VERTEX_AI_MODEL=gemini-pro,
        FASTAPI_APP_ENV=production
      - '--add-cloudsql-instances'
      - 'guild-ai-080:us-central1:guild-ai-sql'
      - '--service-account'
      - 'guild-ai-cloud-run-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--vpc-connector'
      - 'guild-ai-vpc-connector'
      - '--vpc-egress'
      - 'all'
    id: 'deploy-cloud-run'
    waitFor: ['run-migrations']

# Images to store in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/guild-ai:latest'

# Logging configuration (required when using custom service account)
options:
  logging: CLOUD_LOGGING_ONLY
  logStreamingOption: STREAM_ON
