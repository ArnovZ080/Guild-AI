# Correct Netlify build settings for the NewFrontend

[build]
  # The `base` is set in the Netlify UI.
  # The settings in this file are relative to the directory it's in.

  # The publish directory is `dist`
  publish = "dist"

  # The full build command using pnpm
  command = "corepack enable && pnpm install --frozen-lockfile=false && pnpm run build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "8.15.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
